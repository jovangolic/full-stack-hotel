spring.application.name=back-v2
server.port=8080

#spring.datasource.url=jdbc:mysql://localhost:3306/hotel_database?serverTimezone=UTC
#spring.datasource.url=jdbc:mysql://mysql-docker:3306/hotel_database_docker?serverTimezone=UTC
spring.datasource.url=jdbc:mysql://mysql:3306/hotel_database_docker?serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.main.allow-circular-references=true
server.error.include-message=always

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.servlet.multipart.max-file-size=15000KB
spring.servlet.multipart.max-request-size=15000KB
spring.servlet.multipart.enabled=true


spring.jpa.properties.hibernate.format_sql=true


spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000


logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


