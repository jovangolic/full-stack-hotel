services:
  frontend:
    build:
      context: ./hotel-front
    image: hotel-front-image
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - hotel-network

  backend:
    build:
      context: ./back-v2
    image: back-v2-image
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-docker:3306/hotel_database_docker
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hotel-network

  mysql:
    container_name: mysql-docker
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hotel_database_docker
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql-docker:/var/lib/mysql
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-docker:

networks:
  hotel-network:
